[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "delta-chat"
version = "0.1.0"
description = "Document Delta & Grounded Chat -- Applied AI Engineer Take-Home"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.23.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "Pillow>=10.0.0",
    "ezdxf>=1.2.0",
    "sentence-transformers>=2.7.0",
    "chromadb>=0.5.0",
    "numpy>=1.26.0",
    "groq>=0.9.0",
    "streamlit>=1.36.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
